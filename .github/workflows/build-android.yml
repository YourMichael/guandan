name: 打包安卓 App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 内置字体（失败也不影响打包）
        run: python3 scripts/bundle_fonts.py

      - name: 安装 Capacitor
        run: npm ci

      - name: 生成安卓工程
        run: npx cap add android

      - name: 换上图标和启动图
        run: |
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          cp -r resources/android/res/. android/app/src/main/res/

      - name: 同步网页到安卓工程
        run: npx cap sync android

      - name: 使用固定签名（以后升级可直接覆盖安装）
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore

      - name: 编译 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../QMengGuandan.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QMengGuandan-apk
          path: QMengGuandan.apk

      - name: 发布到 Releases（手机可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Q萌掼蛋 v1.0.${{ github.run_number }}
          files: QMengGuandan.apk
